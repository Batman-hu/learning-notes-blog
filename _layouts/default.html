<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} RSS" href="{{ '/feed.xml' | relative_url }}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('blog-theme')||'light'}catch(e){}</script>
</head>
<body>
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}，返回首页">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
        <span>{{ site.title }}</span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.section == 'home' %}aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/notes/' | relative_url }}" {% if page.section == 'notes' %}aria-current="page"{% endif %}>学习笔记</a>
        <a href="{{ '/solutions/' | relative_url }}" {% if page.section == 'solutions' %}aria-current="page"{% endif %}>问题记录</a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.section == 'archive' %}aria-current="page"{% endif %}>归档</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>关于</a>
      </nav>
      <div class="header-actions">
        <a class="icon-button" href="{{ '/search/' | relative_url }}" aria-label="搜索文章" title="搜索文章">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        </a>
        <button class="icon-button theme-toggle" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.5 15.5A8 8 0 0 1 8.5 4.5 8 8 0 1 0 19.5 15.5Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p>{{ site.description }}</p>
      </div>
      <div class="footer-links">
        <a href="{{ '/archive/' | relative_url }}">文章归档</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a>
        <a href="{{ '/about/' | relative_url }}">关于本站</a>
      </div>
      <small>© {{ 'now' | date: '%Y' }} {{ site.title }} · 由 GitHub Pages 托管</small>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
